sonar.projectKey=gravity-markdown
sonar.projectName=GravityMD
sonar.projectVersion=1.1.0

# Application code + tests (Rust backend is analysed as source too).
sonar.sources=src,src-tauri/src
sonar.tests=tests

# Heavy build output, generated artefacts and local evidence must never be
# indexed: the Rust target tree alone is several GB.
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  src-tauri/target/**,\
  src-tauri/gen/**,\
  impeccable-shots/**,\
  docs/**,\
  .impeccable/**,\
  scripts/**,\
  **/*.min.js

sonar.test.exclusions=tests/**/*.d.ts

# Coverage comes from `npm run test:coverage` (c8 writes coverage/lcov.info).
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-ui/lcov.info
sonar.typescript.tsconfigPath=tsconfig.app.json
